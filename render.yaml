# Render Blueprint: PostgreSQL + the web service, wired together.
#
# Render reads this when you create a Blueprint from the repo, so the database,
# the connection string and the environment are set up in one step instead of
# twenty form fields. Values that must stay secret are marked `sync: false` -
# Render prompts for them at deploy time and never stores them in git.
#
# The defaults here are the ones that work on the free instance type:
#   - `search-crawl` is off, so Chromium never launches. It is the only channel
#     that needs a browser, and 512 MB is not enough to run one reliably next to
#     Node. The ATS APIs supply most of the postings anyway (44 of 48 on the last
#     verification run).
#   - The cron schedule is every 6 hours rather than every 30 minutes, because a
#     free service sleeps after 15 minutes of inactivity and an in-process
#     scheduler sleeps with it. See the README for what to change on a paid plan.

databases:
  - name: jobbot-db
    databaseName: jobbot
    user: jobbot
    plan: free
    postgresMajorVersion: "16"
    # Must match the web service's region below. Render's internal hostname
    # (`dpg-...-a`) only resolves inside one region, so a database in Oregon and
    # a service in Singapore fail with `getaddrinfo ENOTFOUND` at boot - and
    # neither resource can be moved afterwards, only recreated.
    region: singapore

services:
  - type: web
    name: job-application-bot
    runtime: docker
    plan: free
    # Closest region to India; move it nearer to you if that is not where you
    # are - and change the database's region to match, or the two cannot talk.
    region: singapore
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Set once in the dashboard, deliberately NOT wired to the database block.
      #
      # `fromDatabase` looks tidier and is right when both resources were created
      # together in one region. It is a trap otherwise: it regenerates the
      # *internal* connection string on every blueprint sync, so if the database
      # lives in another region - where that hostname does not resolve - a sync
      # silently overwrites a working external URL with a broken internal one,
      # and the next deploy dies with `getaddrinfo ENOTFOUND dpg-...-a` while the
      # previous deploy keeps serving.
      #
      # Paste the database's Internal Connection String when it shares the
      # service's region, or the External one when it does not.
      - key: DATABASE_URL
        sync: false
      # Generated once and kept. Rotating it logs every user out.
      - key: JWT_SECRET
        generateValue: true
      # Prompted for at deploy time. Without it the app still runs, scoring
      # postings with the local keyword fallback instead of the LLM.
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      # All three channels. `search-crawl` is listed because it does not need a
      # browser to work - see SCRAPER_USE_BROWSER below.
      - key: ENABLED_CHANNELS
        value: ats-api,job-feeds,search-crawl
      # Chromium in 512 MB gets the process OOM-killed. Off, the search channel
      # queries engines over plain HTTP instead of rendering them.
      - key: SCRAPER_USE_BROWSER
        value: "false"
      - key: CRON_SCHEDULE
        value: 0 */6 * * *
      - key: CRON_TIMEZONE
        value: Asia/Kolkata
      # A new database has an empty board registry, and on a free instance the
      # in-process scheduler only runs while somebody is using the site. Scraping
      # on boot means the first visit already has something to show: the feeds
      # seed ~48 boards for the ATS channel to walk on the next run.
      - key: RUN_ON_STARTUP
        value: "true"
      # The gates are strict on purpose - roughly one posting in ten survives the
      # relevance, location and match bars - so a small run reliably stores
      # nothing. These are sized to give each run a real sample. The dashboard no
      # longer waits on the request, so a longer run costs nothing but time.
      - key: SCRAPER_MAX_BOARDS
        value: "40"
      - key: SCRAPER_MAX_NEW_JOBS
        value: "120"
      - key: MAX_JOBS_PER_SOURCE
        value: "8"
      - key: SCRAPER_MAX_PER_COMPANY
        value: "5"
      - key: MIN_MATCH_SCORE
        value: "50"
      # Measured on a real run: of eight postings that survived collection, seven
      # were rejected as "too senior" and none reached the LLM. At 1 an entry
      # level candidate sees mid level roles only, which on an open crawl of
      # startup boards is almost nothing. At 2 senior openings come through as a
      # stretch, scored and capped at 75. Set it back to 1 if the board fills
      # with roles you would not be called for.
      - key: RELEVANCE_MAX_LEVEL_STRETCH
        value: "2"
      # Only postings that name a location in the candidate's country. "Remote"
      # on a US board almost always means remote within the US, so accepting it
      # fills the board with roles that look open and are not. This is a large
      # cut in volume - set it to false to let genuinely worldwide-remote and
      # location-less postings back in.
      - key: EXCLUDE_REMOTE
        value: "true"

# Scraping on a schedule that does not depend on anyone visiting the site.
#
# The web service runs the cron in-process, which is enough while the instance
# is awake - and a free instance sleeps after 15 minutes of inactivity, so in
# practice it only scrapes while you are watching. That is the opposite of what
# a job bot is for.
#
# A cron *service* has no such problem: it wakes on its own schedule, runs
# `scripts/scrape.js` against the same database, and exits. Render bills cron
# services by runtime, so this is left commented out rather than quietly
# creating something chargeable. Uncomment it, set the same DATABASE_URL and
# NVIDIA_API_KEY in the dashboard, and set CRON_SCHEDULE="" on the web service so
# the two schedulers do not both scrape.
#
#  - type: cron
#    name: jobbot-scrape
#    runtime: docker
#    region: singapore
#    plan: starter
#    branch: main
#    schedule: "0 */6 * * *"
#    dockerCommand: node scripts/scrape.js
#    envVars:
#      - key: DATABASE_URL
#        sync: false
#      - key: NVIDIA_API_KEY
#        sync: false
#      - key: SCRAPER_USE_BROWSER
#        value: "false"
